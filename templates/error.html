{% extends 'base.html' %}
{% from 'ui.html' import icon, header %}
{% block content %}<div class="error-page panel">{{ header(title,message) }}<a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">{{ icon('back',18) }} {{ 'Back to dashboard' if current_user.is_authenticated else 'Back to sign in' }}</a></div>{% endblock %}
